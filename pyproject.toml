[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fund-nav-engine"
version = "0.1.0"
description = "Daily NAV calculation for a multi-class fund, reconciled to the custodian and brokers"
readme = "README.md"
authors = [{ name = "Sanjay Nair" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
fundnav = "fundnav.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
